<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optic</title>
<meta name="description" content="Optic Terminal: stock and options research, read in plain words.">
<meta name="theme-color" content="#0b0b0a">
<!-- Kept out of search results, as the classic page is. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- The rebuilt frontend, served beside the current app while pages move
     across (docs/frontend-v2/COVERAGE.md). Same fonts as the current app. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/opsz.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/space-grotesk/index.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<script>
  // The theme and text size the reader chose in Settings, applied before paint.
  try {
    // dark unless the reader chose Light, or chose to match a light system
    var t = localStorage.getItem('optic.theme');
    var light = t === 'light' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', light ? 'ivory' : 'charcoal');
    // text size (optic.ui.scale.v1): v2 is drawn at the classic Default, so scale from there
    var z = { compact: 1 / 1.15, large: 1.3 / 1.15 }[localStorage.getItem('optic.ui.scale.v1')];
    if (z) document.documentElement.style.zoom = String(z);
  } catch (e) { /* private mode: follow the system */ }
</script>
<!-- Scout, Milo's mascot: the classic app's own figure and sprites (/components/scout.js, /scout/), so the
     two apps show the same one. A classic script, run before the app, that sets window.OpticScout. -->
<script src="/components/scout.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Optic needs JavaScript. The <a href="/">current app</a> needs it too.</p></noscript>
</body>
</html>
