# The whole suite on every pull request and every push to main (added 2026-11-09).
#
# - suite: the Python tests and the browser journeys (tests/e2e) on macOS, because about a thousand of the tests run
#   the front end's modules in JavaScriptCore, which macOS has and Linux does not (they skip without it). Outbound
#   HTTP is pinned to a closed local port, so no test can reach a real provider; Anthropic is a recording stub.
#   The count it ran is written to the run's summary, and the run fails below the floor this pass closed with.
# - image: builds the Dockerfile, as a deploy does.
# - secrets: gitleaks over the full history, with .gitleaks.toml's allowlist (storage key names, test fixtures).
name: tests

on:
  pull_request:
  push:
    # main, and the branches a pull request from a fork is built on (so the run shows on the fork before review)
    branches: [main, "factory/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # the floor: what Pass 1 closed with. Lower it only with a reason in the pull request.
      MIN_PASSED: "8994"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - name: Tests
        # outbound HTTP pinned to a closed port, both spellings (curl reads the lowercase ones), set in the shell
        # because the workflow's env section treats the two spellings as one key
        run: |
          export HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost
          python -m pytest -q -p no:cacheprovider --junitxml=junit.xml
      - name: Count
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.get("tests", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          passed = total - failed - skipped
          line = f"Tests: {passed} passed, {failed} failed, {skipped} skipped, {total} in all"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {line}\n\nFloor: {os.environ['MIN_PASSED']} passed.\n")
          floor = int(os.environ["MIN_PASSED"])
          if passed < floor:
              raise SystemExit(f"{passed} passed is below the floor of {floor}")
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit
          path: junit.xml

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t optic:ci .
      - name: Start it and read /healthz
        run: |
          docker run -d --name optic -p 8077:8077 -e HTTPS_PROXY=http://127.0.0.1:9 -e HTTP_PROXY=http://127.0.0.1:9 optic:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8077/healthz && exit 0; sleep 2; done
          docker logs optic; exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks, full history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
